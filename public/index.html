<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduForge - Education & Tutoring Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1)}
    .gradient-text{background:linear-gradient(135deg,#34d399,#2dd4bf);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  </style>
</head>
<body class="bg-[#0a0a0f] min-h-screen text-white">
  <header class="glass sticky top-0">
    <div class="max-w-7xl mx-auto px-8 py-5 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg">
          <i class="fas fa-graduation-cap text-2xl"></i>
        </div>
        <div><h1 class="text-2xl font-bold gradient-text">EduForge</h1><p class="text-xs text-slate-400">Education & Tutoring Assistant</p></div>
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-8 py-10">
    <div class="grid grid-cols-4 gap-6 mb-10">
      <div class="glass rounded-2xl p-6"><p class="text-slate-400 text-sm mb-2">Topics</p><p class="text-4xl font-bold">48</p></div>
      <div class="glass rounded-2xl p-6"><p class="text-slate-400 text-sm mb-2">Quizzes</p><p class="text-4xl font-bold">156</p></div>
      <div class="glass rounded-2xl p-6"><p class="text-slate-400 text-sm mb-2">Progress</p><p class="text-4xl font-bold">78%</p></div>
      <div class="glass rounded-2xl p-6"><p class="text-slate-400 text-sm mb-2">Time Saved</p><p class="text-4xl font-bold">24h</p></div>
    </div>
    <div class="grid lg:grid-cols-3 gap-8">
      <div class="glass rounded-2xl p-8">
        <h2 class="text-xl font-bold mb-6"><i class="fas fa-magic text-emerald-400 mr-3"></i>Generate Quiz</h2>
        <div class="space-y-4">
          <input placeholder="Enter topic..." class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white placeholder-slate-500">
          <select class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white">
            <option>Multiple Choice</option><option>True/False</option><option>Short Answer</option>
          </select>
          <button class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl font-semibold"><i class="fas fa-wand-magic-sparkles mr-2"></i>Generate</button>
        </div>
      </div>
      <div class="col-span-2 glass rounded-2xl p-8">
        <h2 class="text-xl font-bold mb-6"><i class="fas fa-tasks text-teal-400 mr-3"></i>Study Plan</h2>
        <div class="space-y-3">
          <div class="bg-white/5 rounded-xl p-4">
            <div class="flex items-center justify-between mb-2">
              <span class="font-semibold">JavaScript Basics</span>
              <span class="text-xs px-3 py-1 rounded-lg bg-emerald-500/20 text-emerald-400">In Progress</span>
            </div>
            <div class="h-2 bg-white/10 rounded-full"><div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full" style="width:80%"></div></div>
          </div>
          <div class="bg-white/5 rounded-xl p-4">
            <div class="flex items-center justify-between mb-2">
              <span class="font-semibold">React Fundamentals</span>
              <span class="text-xs px-3 py-1 rounded-lg bg-slate-500/20 text-slate-400">Starting</span>
            </div>
            <div class="h-2 bg-white/10 rounded-full"><div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full" style="width:45%"></div></div>
          </div>
          <div class="bg-white/5 rounded-xl p-4">
            <div class="flex items-center justify-between mb-2">
              <span class="font-semibold">Node.js Backend</span>
              <span class="text-xs px-3 py-1 rounded-lg bg-slate-500/20 text-slate-400">Pending</span>
            </div>
            <div class="h-2 bg-white/10 rounded-full"><div class="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full" style="width:20%"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
